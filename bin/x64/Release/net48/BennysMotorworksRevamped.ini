
; =========================================================
; Benny's Motor Works Revamped by Nochala
; =========================================================
; Boolean options use true / false.
; Control names use GTA / ScriptHookVDotNet control names.

[SETTINGS]
; (Default=true)
LOGGING=true

; (Default=false)
DEBUGLOGGING=false

; Enables mouse support while using the Benny's customization menus. (Default=true)
EnableMouse=true

; Allows customizing Emergency vehicles in bennys. (Default=true)
AllowEmergencyVehicles=true 

;  Allows customizing oversized vehicles in bennys, may be buggy. (Default=false)
AllowOversizedVehicles=false


[CONTROLS]
; (Default=NextCamera)
FirstPerson=NextCamera

; Controls the input for opening/closing vehicle doors in Benny's.(Default=ParachuteBrakeLeft)
Door=ParachuteBrakeLeft

; Controls the input for raising/lowering convertible vehicles roof in Benny's.(Default=ParachuteBrakeRight)
Roof=ParachuteBrakeRight

; (Default=FrontendLt)
ZoomOut=FrontendLt

; (Default=FrontendRt)
ZoomIn=FrontendRt


[UPGRADE]
; Defines optional custom vehicle conversions for Benny's Performance Upgrades.
; Note that this will be improved further in future updates.
;
; Format:
; sourcevehiclelabel_Model=targetmodel
; sourcevehiclelabel_Price=price
;
; sourcevehiclelabel:
; The source vehicle's <gameName> label from vehicles.meta.
; Use lowercase when possible.
;
; targetmodel:
; The internal model/spawn name of the vehicle created after purchasing
; the upgrade. The target vehicle must be installed and valid.
;
; Price:
; The amount charged for the conversion. Use numbers only, without
; dollar signs or commas. A missing price defaults to 0.
;
; Custom conversions are one-way and do not automatically provide a
; "Remove Upgrade" option. Most vehicle colors, wheels, modifications,
; license plate settings, and other customization are transferred.
;
; Example:
; cheetah5_Model=Cheetah5Custom
; cheetah5_Price=100000

vehiclelabel_Model=targetmodel
vehiclelabel_Price=100000